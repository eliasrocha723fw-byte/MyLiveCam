<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Cámara Live Photo iOS</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            color: #fff;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Ocultar reproductores de controles nativos en Android WebViews */
        video::-webkit-media-controls,
        video::-webkit-media-controls-start-playback-button,
        video::-webkit-media-controls-play-button {
            display: none !important;
            -webkit-appearance: none !important;
            opacity: 0 !important;
        }

        /* Live Photo Pulsing Ring Animation */
        @keyframes livePulse {
            0% { transform: scale(1); opacity: 0.85; }
            50% { transform: scale(1.12); opacity: 1; filter: drop-shadow(0 0 8px #facc15); }
            100% { transform: scale(1); opacity: 0.85; }
        }

        .animate-live-glow {
            animation: livePulse 2s infinite ease-in-out;
        }

        /* Shutter press effect */
        .shutter-btn:active .shutter-inner {
            transform: scale(0.85);
        }

        /* iOS Glassmorphism styling */
        .glass-panel {
            background: rgba(20, 20, 20, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* Hide scrollbars */
        ::-webkit-scrollbar {
            display: none;
        }

        /* Viewer zoom dynamic transition */
        .live-photo-container {
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .live-photo-container.is-playing {
            transform: scale(1.025);
        }

        /* Shutter Flash Animation */
        @keyframes shutterFlash {
            0% { opacity: 0.95; }
            100% { opacity: 0; }
        }
        .flash-overlay {
            animation: shutterFlash 0.35s ease-out forwards;
        }
    </style>
</head>
<body class="h-screen w-screen relative bg-black select-none overflow-hidden flex flex-col justify-between">

    <div id="appContainer" class="relative w-full h-full flex flex-col justify-between overflow-hidden">
        
        <!-- Screen Flash Effect Overlay -->
        <div id="flashEffect" class="hidden absolute inset-0 bg-white z-40 pointer-events-none"></div>

        <!-- TOP CONTROL BAR -->
        <div class="relative z-20 pt-4 pb-2 px-6 flex items-center justify-between glass-panel rounded-b-3xl mx-2 mt-2">
            <!-- Flash Toggle Button -->
            <button id="flashBtn" class="p-2.5 rounded-full bg-white/10 active:bg-white/30 text-white transition">
                <i data-lucide="zap-off" class="w-5 h-5"></i>
            </button>

            <!-- LIVE PHOTO TOGGLE BUTTON -->
            <button id="liveToggleBtn" class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-yellow-500/20 text-yellow-400 border border-yellow-500/40 transition active:scale-95">
                <div class="relative flex items-center justify-center">
                    <svg class="w-5 h-5 animate-live-glow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3" fill="currentColor"/>
                        <circle cx="12" cy="12" r="7" stroke-dasharray="3 3"/>
                        <circle cx="12" cy="12" r="10" stroke-opacity="0.5"/>
                    </svg>
                </div>
                <span class="text-xs font-bold tracking-wider uppercase">LIVE</span>
            </button>

            <!-- Switch Front/Back Camera -->
            <button id="flipCameraBtn" class="p-2.5 rounded-full bg-white/10 active:bg-white/30 text-white transition">
                <i data-lucide="refresh-cw" class="w-5 h-5"></i>
            </button>
        </div>

        <div id="viewfinderArea" class="relative flex-1 my-2 mx-2 rounded-3xl overflow-hidden bg-zinc-950 flex items-center justify-center border border-white/10 shadow-2xl cursor-pointer">
            <!-- Camera Viewfinder Stream -->
            <video id="cameraStream" autoplay playsinline webkit-playsinline muted class="w-full h-full object-cover pointer-events-none"></video>
            
            <!-- Hidden Capture Canvas -->
            <canvas id="captureCanvas" class="hidden"></canvas>

            <!-- Recording Live Photo Indicator -->
            <div id="liveBadgeIndicator" class="hidden absolute top-4 left-1/2 -translate-x-1/2 z-30 flex items-center gap-2 px-3.5 py-1 rounded-full bg-yellow-500/90 text-black text-xs font-bold tracking-wide shadow-lg animate-pulse">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="12" cy="12" r="3" fill="currentColor"/>
                    <circle cx="12" cy="12" r="7" stroke-dasharray="2 2"/>
                </svg>
                <span>LIVE PHOTO</span>
            </div>

            <!-- Camera Permission Fallback -->
            <div id="cameraPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center bg-zinc-900 z-10 hidden">
                <i data-lucide="camera-off" class="w-12 h-12 text-zinc-500 mb-3"></i>
                <p class="text-sm text-zinc-400 max-w-xs mb-4">Permite el acceso a la cámara para tomar tus Live Photos.</p>
                <button id="retryCameraBtn" class="px-5 py-2.5 bg-white text-black text-xs font-semibold rounded-full active:scale-95 transition">
                    Activar Cámara
                </button>
            </div>
        </div>

        <div class="relative z-20 pb-8 pt-4 px-8 glass-panel rounded-t-3xl mx-2 mb-2 flex flex-col items-center gap-4">
            <!-- Mode Picker Bar -->
            <div class="flex items-center gap-6 text-xs font-semibold uppercase tracking-widest text-zinc-400">
                <span class="hover:text-white cursor-pointer transition">FOTO</span>
                <span class="text-yellow-400 font-bold border-b-2 border-yellow-400 pb-0.5">LIVE</span>
                <span class="hover:text-white cursor-pointer transition">VÍDEO</span>
            </div>

            <!-- Controls Row -->
            <div class="w-full flex items-center justify-between px-2">
                <!-- Gallery Thumbnail Trigger -->
                <button id="openGalleryBtn" class="relative w-14 h-14 rounded-2xl overflow-hidden border-2 border-white/30 bg-zinc-800 flex items-center justify-center active:scale-90 transition shadow-md">
                    <img id="galleryThumbImg" src="" class="w-full h-full object-cover hidden" alt="Galería" />
                    <i id="galleryEmptyIcon" data-lucide="image" class="w-6 h-6 text-zinc-400"></i>
                    <span id="galleryCountBadge" class="hidden absolute -top-1 -right-1 bg-yellow-500 text-black text-[10px] font-extrabold w-5 h-5 rounded-full items-center justify-center shadow">
                        0
                    </span>
                </button>

                <!-- iOS Shutter Button -->
                <button id="shutterBtn" class="shutter-btn relative w-20 h-20 rounded-full border-4 border-white flex items-center justify-center p-1 active:scale-95 transition shadow-2xl">
                    <div class="shutter-inner w-full h-full bg-white rounded-full transition-transform duration-150"></div>
                </button>

                <!-- Direct Export Button -->
                <button id="quickExportBtn" class="w-14 h-14 rounded-full bg-white/10 flex items-center justify-center text-white active:bg-white/20 transition">
                    <i data-lucide="share" class="w-6 h-6"></i>
                </button>
            </div>
        </div>
    </div>

    <div id="galleryModal" class="hidden fixed inset-0 z-50 bg-black flex flex-col justify-between transition-opacity duration-300">
        <!-- Gallery Header -->
        <div class="px-6 py-4 flex items-center justify-between glass-panel border-b border-white/10 z-20">
            <button id="closeGalleryBtn" class="flex items-center gap-2 text-white/80 active:text-white text-sm font-medium">
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
                Cámara
            </button>
            <div class="text-center">
                <h3 class="text-sm font-semibold">Live Photos</h3>
                <p id="galleryCounterText" class="text-[11px] text-zinc-400">0 Elementos</p>
            </div>
            <button id="deletePhotoBtn" class="p-2 text-red-400 hover:text-red-300 active:scale-90 transition">
                <i data-lucide="trash-2" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Interactive Live Photo Display Box -->
        <div class="relative flex-1 flex items-center justify-center p-4 bg-zinc-950 overflow-hidden">
            <!-- Gallery Empty Placeholder -->
            <div id="galleryEmptyState" class="text-center text-zinc-500 flex flex-col items-center">
                <i data-lucide="camera" class="w-12 h-12 mb-2 opacity-40"></i>
                <p class="text-sm">Aún no has capturado ninguna Live Photo.</p>
            </div>

            <!-- Live Viewer Active Frame -->
            <div id="liveViewerFrame" class="hidden relative max-w-full max-h-full rounded-2xl overflow-hidden shadow-2xl border border-white/10 flex items-center justify-center live-photo-container">
                <!-- Base High-Res Still Photo -->
                <img id="viewerStillImg" class="w-full h-full object-contain max-h-[75vh]" alt="Live Photo" />
                
                <!-- Motion Video Clip Layer -->
                <video id="viewerMotionVideo" playsinline webkit-playsinline loop muted class="hidden absolute inset-0 w-full h-full object-contain"></video>

                <!-- Live Badge Indicator -->
                <div id="viewerLiveBadge" class="absolute top-3 left-3 z-30 flex items-center gap-1.5 px-3 py-1 rounded-full bg-black/60 backdrop-blur-md border border-white/20 text-yellow-400 text-xs font-semibold shadow-lg">
                    <svg class="w-4 h-4 animate-live-glow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3" fill="currentColor"/>
                        <circle cx="12" cy="12" r="7" stroke-dasharray="2 2"/>
                    </svg>
                    <span id="viewerBadgeText">LIVE</span>
                </div>

                <!-- Interaction Hint -->
                <div id="holdHint" class="absolute bottom-3 inset-x-0 text-center pointer-events-none">
                    <span class="px-3 py-1 bg-black/60 backdrop-blur-sm rounded-full text-[11px] text-zinc-300 border border-white/10 shadow">
                        Mantén presionado para ver el movimiento
                    </span>
                </div>
            </div>
        </div>

        <!-- Gallery Navigation Bar -->
        <div class="p-6 glass-panel border-t border-white/10 flex items-center justify-between z-20">
            <button id="prevPhotoBtn" class="p-3 bg-white/10 rounded-full text-white active:bg-white/20 transition disabled:opacity-30">
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
            </button>

            <!-- Export / Share Button -->
            <button id="exportModalBtn" class="flex items-center gap-2 px-6 py-3 bg-yellow-500 hover:bg-yellow-400 text-black font-bold text-sm rounded-full active:scale-95 transition shadow-lg">
                <i data-lucide="share" class="w-4 h-4"></i>
                Exportar / Compartir
            </button>

            <button id="nextPhotoBtn" class="p-3 bg-white/10 rounded-full text-white active:bg-white/20 transition disabled:opacity-30">
                <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </button>
        </div>
    </div>

    <div id="exportModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="w-full sm:max-w-md glass-panel rounded-t-3xl sm:rounded-3xl p-6 border border-white/15 shadow-2xl flex flex-col gap-5">
            <!-- Modal Header -->
            <div class="flex items-center justify-between border-b border-white/10 pb-3">
                <div class="flex items-center gap-2">
                    <div class="w-7 h-7 rounded-full bg-yellow-500/20 text-yellow-400 flex items-center justify-center border border-yellow-500/40">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3" fill="currentColor"/>
                            <circle cx="12" cy="12" r="7" stroke-dasharray="2 2"/>
                        </svg>
                    </div>
                    <h3 class="font-bold text-base">Exportar Live Photo</h3>
                </div>
                <button id="closeExportBtn" class="p-1 rounded-full text-zinc-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Preview Card -->
            <div class="relative w-full h-40 rounded-2xl overflow-hidden bg-zinc-900 border border-white/10 flex items-center justify-center">
                <img id="exportPreviewImg" class="w-full h-full object-cover" alt="Preview Export" />
                <div class="absolute top-2 left-2 px-2.5 py-0.5 rounded-full bg-black/70 border border-yellow-400/50 text-yellow-400 text-[10px] font-bold tracking-wide flex items-center gap-1 shadow">
                    <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3" fill="currentColor"/>
                        <circle cx="12" cy="12" r="7" stroke-dasharray="2 2"/>
                    </svg>
                    LIVE PHOTO
                </div>
            </div>

            <!-- Action Buttons List -->
            <div class="flex flex-col gap-2.5">
                <!-- Native System Share -->
                <button id="shareNativeBtn" class="w-full py-3 px-4 rounded-xl bg-white/10 hover:bg-white/20 active:scale-98 text-left flex items-center justify-between border border-white/10 transition">
                    <div class="flex items-center gap-3">
                        <i data-lucide="share-2" class="w-5 h-5 text-yellow-400"></i>
                        <div>
                            <div class="text-sm font-semibold">Compartir con Insignia Live</div>
                            <div class="text-xs text-zinc-400">Envía la foto + clip de animación a otras apps</div>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-500"></i>
                </button>

                <!-- Save Video File (MP4) -->
                <button id="exportVideoBtn" class="w-full py-3 px-4 rounded-xl bg-white/10 hover:bg-white/20 active:scale-98 text-left flex items-center justify-between border border-white/10 transition">
                    <div class="flex items-center gap-3">
                        <i data-lucide="video" class="w-5 h-5 text-blue-400"></i>
                        <div>
                            <div class="text-sm font-semibold">Guardar Clip de Vídeo (MP4)</div>
                            <div class="text-xs text-zinc-400">Descarga el bucle animado completo</div>
                        </div>
                    </div>
                    <i data-lucide="download" class="w-4 h-4 text-zinc-400"></i>
                </button>

                <!-- Save JPG Still Photo -->
                <button id="exportStillBtn" class="w-full py-3 px-4 rounded-xl bg-white/10 hover:bg-white/20 active:scale-98 text-left flex items-center justify-between border border-white/10 transition">
                    <div class="flex items-center gap-3">
                        <i data-lucide="image" class="w-5 h-5 text-purple-400"></i>
                        <div>
                            <div class="text-sm font-semibold">Guardar Foto Estática (JPG)</div>
                            <div class="text-xs text-zinc-400">Imagen de alta resolución principal</div>
                        </div>
                    </div>
                    <i data-lucide="download" class="w-4 h-4 text-zinc-400"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Notification Toast Popup -->
    <div id="toast" class="hidden fixed top-6 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 px-4 py-2.5 rounded-full bg-white text-black font-semibold text-xs shadow-2xl transition-all duration-300">
        <i id="toastIcon" data-lucide="check-circle-2" class="w-4 h-4 text-emerald-600"></i>
        <span id="toastMsg">Notificación</span>
    </div>

    <script>
        // Camera Engine & Application State
        let currentStream = null;
        let ringBufferRecorder = null;
        let ringBufferChunks = [];
        let isLiveEnabled = true;
        let facingMode = 'environment';
        let isFlashOn = false;
        let isCapturing = false;
        let livePhotosList = [];
        let activePhotoIndex = 0;
        let db = null;

        // DOM Element Cache
        const viewfinderArea = document.getElementById('viewfinderArea');
        const cameraStream = document.getElementById('cameraStream');
        const captureCanvas = document.getElementById('captureCanvas');
        const flashBtn = document.getElementById('flashBtn');
        const liveToggleBtn = document.getElementById('liveToggleBtn');
        const flipCameraBtn = document.getElementById('flipCameraBtn');
        const shutterBtn = document.getElementById('shutterBtn');
        const flashEffect = document.getElementById('flashEffect');
        const liveBadgeIndicator = document.getElementById('liveBadgeIndicator');
        const cameraPlaceholder = document.getElementById('cameraPlaceholder');
        
        // Gallery Elements
        const openGalleryBtn = document.getElementById('openGalleryBtn');
        const galleryThumbImg = document.getElementById('galleryThumbImg');
        const galleryEmptyIcon = document.getElementById('galleryEmptyIcon');
        const galleryCountBadge = document.getElementById('galleryCountBadge');
        const galleryModal = document.getElementById('galleryModal');
        const closeGalleryBtn = document.getElementById('closeGalleryBtn');
        const galleryEmptyState = document.getElementById('galleryEmptyState');
        const liveViewerFrame = document.getElementById('liveViewerFrame');
        const viewerStillImg = document.getElementById('viewerStillImg');
        const viewerMotionVideo = document.getElementById('viewerMotionVideo');
        const viewerBadgeText = document.getElementById('viewerBadgeText');
        const prevPhotoBtn = document.getElementById('prevPhotoBtn')
